[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salarymen"
version = "0.1.0"
description = "Self-hosted open-source Lovable: tireless AI workers build, verify, and improve your app from vague prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GTHell" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
vision = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
salarymen = "salarymen.cli:main"

[tool.setuptools.packages.find]
include = ["salarymen*"]
